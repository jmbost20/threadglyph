# SonarQube Cloud, CI-based analysis. Organization/project keys are confirmed at setup
# (see docs/sonar-experiments.md) — update both if the imported project uses different keys.
sonar.organization=jmbost20
sonar.projectKey=jmbost20_threadglyph
sonar.projectName=Threadglyph

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Every production file is analysed and counted for coverage; nothing is excluded to inflate numbers.
