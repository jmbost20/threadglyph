name: OpenSSF Scorecard

# Scores the repository's security practices (branch protection, pinned actions,
# reviews, and so on) and publishes the result for the README badge. Scorecard only
# publishes for public repositories, so it is skipped while this one is private.
on:
  push:
    branches: [main]
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Free for public repositories only; skipped while this one is private.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
