name: DCO

# Every commit in a pull request needs a "Signed-off-by:" line (git commit -s),
# certifying the Developer Certificate of Origin. See CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Commits are signed off
    # Dependabot's commits are generated, not contributed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: '; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") is not signed off"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with: git rebase --signoff $BASE, then push the branch again. See CONTRIBUTING.md."
            exit 1
          fi
