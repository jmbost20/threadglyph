version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Obsidian supplies CodeMirror at runtime and pins exact peer versions;
      # these follow the obsidian package, not the latest release.
      - dependency-name: '@codemirror/*'
    groups:
      # Vitest and its coverage plugin pin each other exactly, so they always move
      # together, majors included; a lone major of either could never install.
      vitest:
        patterns: ['vitest', '@vitest/*']
      # Other minor and patch updates travel together; each other major update gets
      # its own PR so a breaking release can't ride in with the rest.
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
